<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%">
      <stop offset="0" stop-color="#FFFDF6"/>
      <stop offset="0.7" stop-color="#F8EBD6"/>
      <stop offset="1" stop-color="#EDD9BC"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="46" height="46" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="2.1" fill="#E3CDA9" opacity="0.85"/>
    </pattern>
    <linearGradient id="crust" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DEA557"/>
      <stop offset="0.6" stop-color="#C98A3F"/>
      <stop offset="1" stop-color="#9A5F26"/>
    </linearGradient>
    <radialGradient id="crumb" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#F9E6A6"/>
      <stop offset="0.7" stop-color="#EFD287"/>
      <stop offset="1" stop-color="#D9B45F"/>
    </radialGradient>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C08447"/>
      <stop offset="0.15" stop-color="#A96F3C"/>
      <stop offset="1" stop-color="#7C4E27"/>
    </linearGradient>
    <radialGradient id="floorShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#3A2415" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#3A2415" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity="0.35"/></filter>
  </defs>

  <rect width="600" height="600" fill="url(#bg)"/>
  <rect width="600" height="600" fill="url(#dots)"/>
  <circle cx="300" cy="298" r="198" fill="none" stroke="#DEC49C" stroke-width="3.5" stroke-dasharray="1 17" stroke-linecap="round"/>

  <!-- Steam -->
  <path d="M232 130 q12 -18 0 -32 q-10 -14 3 -28" fill="none" stroke="#BE9868" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
  <path d="M300 116 q12 -18 0 -32 q-10 -14 3 -28" fill="none" stroke="#BE9868" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
  <path d="M368 130 q12 -18 0 -32 q-10 -14 3 -28" fill="none" stroke="#BE9868" stroke-width="6" stroke-linecap="round" opacity="0.85"/>

  <!-- Floor shadow + board -->
  <ellipse cx="300" cy="492" rx="248" ry="22" fill="url(#floorShadow)"/>
  <rect x="48" y="424" width="504" height="44" rx="22" fill="url(#board)" stroke="#5E3A1E" stroke-width="3"/>
  <rect x="48" y="424" width="504" height="6" rx="3" fill="#D9A86C" opacity="0.7"/>
  <circle cx="86" cy="446" r="7.5" fill="#5E3A1E"/><circle cx="86" cy="446" r="3" fill="#3E2410"/>
  <circle cx="514" cy="446" r="7.5" fill="#5E3A1E"/><circle cx="514" cy="446" r="3" fill="#3E2410"/>

  <!-- Slice 1 (back left) -->
  <g transform="translate(148 320) rotate(-13)" filter="url(#soft)">
    <rect x="-66" y="-94" width="132" height="188" rx="25" fill="url(#crust)" stroke="#7C4E1F" stroke-width="3.5"/>
    <rect x="-50" y="-76" width="100" height="152" rx="18" fill="url(#crumb)"/>
    <path d="M-31 -42 q26 15 62 0 M-35 8 q29 16 70 0 M-31 54 q26 15 62 0" stroke="#D9A24B" stroke-width="7" fill="none" stroke-linecap="round"/>
    <rect x="-22" y="-60" width="22" height="13" rx="3.5" fill="#FFF6CC" opacity="0.95" transform="rotate(-8)"/>
    <rect x="9" y="30" width="19" height="12" rx="3.5" fill="#FFF6CC" opacity="0.95" transform="rotate(10 18 36)"/>
    <g fill="#5F7A3E"><circle cx="-12" cy="-14" r="2.8"/><circle cx="18" cy="-28" r="2.8"/><circle cx="27" cy="-4" r="2.8"/><circle cx="-24" cy="27" r="2.8"/><circle cx="6" cy="18" r="2.4"/></g>
  </g>
  <!-- Slice 2 -->
  <g transform="translate(261 297) rotate(-4)" filter="url(#soft)">
    <rect x="-66" y="-94" width="132" height="188" rx="25" fill="url(#crust)" stroke="#7C4E1F" stroke-width="3.5"/>
    <rect x="-50" y="-76" width="100" height="152" rx="18" fill="url(#crumb)"/>
    <path d="M-31 -42 q26 15 62 0 M-35 8 q29 16 70 0 M-31 54 q26 15 62 0" stroke="#D9A24B" stroke-width="7" fill="none" stroke-linecap="round"/>
    <rect x="-27" y="-62" width="22" height="13" rx="3.5" fill="#FFF6CC" opacity="0.95" transform="rotate(6 -16 -56)"/>
    <rect x="4" y="24" width="19" height="12" rx="3.5" fill="#FFF6CC" opacity="0.95" transform="rotate(-9 13 30)"/>
    <g fill="#5F7A3E"><circle cx="-16" cy="-18" r="2.8"/><circle cx="22" cy="-34" r="2.8"/><circle cx="12" cy="8" r="2.8"/><circle cx="-29" cy="22" r="2.8"/><circle cx="-2" cy="-36" r="2.4"/></g>
  </g>
  <!-- Slice 3 -->
  <g transform="translate(376 299) rotate(5)" filter="url(#soft)">
    <rect x="-66" y="-94" width="132" height="188" rx="25" fill="url(#crust)" stroke="#7C4E1F" stroke-width="3.5"/>
    <rect x="-50" y="-76" width="100" height="152" rx="18" fill="url(#crumb)"/>
    <path d="M-31 -42 q26 15 62 0 M-35 8 q29 16 70 0 M-31 54 q26 15 62 0" stroke="#D9A24B" stroke-width="7" fill="none" stroke-linecap="round"/>
    <rect x="-21" y="-58" width="21" height="12.5" rx="3.5" fill="#FFF6CC" opacity="0.95" transform="rotate(-6 -10 -52)"/>
    <rect x="6" y="28" width="19" height="12" rx="3.5" fill="#FFF6CC" opacity="0.95" transform="rotate(8 15 34)"/>
    <g fill="#5F7A3E"><circle cx="-20" cy="-26" r="2.8"/><circle cx="17" cy="-12" r="2.8"/><circle cx="25" cy="15" r="2.8"/><circle cx="-9" cy="41" r="2.8"/><circle cx="2" cy="-44" r="2.4"/></g>
  </g>
  <!-- Slice 4 (front right) -->
  <g transform="translate(480 332) rotate(15)" filter="url(#soft)">
    <rect x="-64" y="-92" width="128" height="184" rx="25" fill="url(#crust)" stroke="#7C4E1F" stroke-width="3.5"/>
    <rect x="-49" y="-74" width="98" height="148" rx="18" fill="url(#crumb)"/>
    <path d="M-30 -40 q25 14 60 0 M-33 6 q27 15 66 0 M-30 50 q25 14 60 0" stroke="#D9A24B" stroke-width="7" fill="none" stroke-linecap="round"/>
    <rect x="-23" y="-52" width="20" height="12" rx="3.5" fill="#FFF6CC" opacity="0.95" transform="rotate(9 -13 -46)"/>
    <g fill="#5F7A3E"><circle cx="-10" cy="-28" r="2.7"/><circle cx="19" cy="0" r="2.7"/><circle cx="-25" cy="16" r="2.7"/></g>
  </g>

  <!-- Scattered parsley -->
  <g fill="#5F7A3E">
    <circle cx="196" cy="430" r="3"/><circle cx="288" cy="440" r="2.6"/><circle cx="356" cy="428" r="3"/><circle cx="434" cy="438" r="2.6"/><circle cx="246" cy="418" r="2.2"/>
  </g>

  <!-- Sparkle -->
  <polygon points="472,150 475.5,160.5 486.5,160.5 477.5,167 481,178 472,170.8 463,178 466.5,167 457.5,160.5 468.5,160.5" fill="#E4B15A"/>
</svg>
