<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%">
      <stop offset="0" stop-color="#FFFDF6"/>
      <stop offset="0.7" stop-color="#F8EBD6"/>
      <stop offset="1" stop-color="#EDD9BC"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="46" height="46" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="2.1" fill="#E3CDA9" opacity="0.85"/>
    </pattern>
    <radialGradient id="cookie" cx="42%" cy="36%" r="75%">
      <stop offset="0" stop-color="#FBE58C"/>
      <stop offset="0.55" stop-color="#EAB85C"/>
      <stop offset="1" stop-color="#B57A2E"/>
    </radialGradient>
    <radialGradient id="cookieEdge" cx="50%" cy="50%" r="50%">
      <stop offset="0.72" stop-color="#C98A3F" stop-opacity="0"/>
      <stop offset="1" stop-color="#8A5522" stop-opacity="0.55"/>
    </radialGradient>
    <radialGradient id="jam" cx="44%" cy="40%" r="70%">
      <stop offset="0" stop-color="#E0684B"/>
      <stop offset="0.5" stop-color="#B5402F"/>
      <stop offset="1" stop-color="#6E1F14"/>
    </radialGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F0E4D2"/>
    </linearGradient>
    <radialGradient id="floorShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#3A2415" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#3A2415" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity="0.35"/></filter>
  </defs>

  <rect width="600" height="600" fill="url(#bg)"/>
  <rect width="600" height="600" fill="url(#dots)"/>
  <circle cx="300" cy="298" r="198" fill="none" stroke="#DEC49C" stroke-width="3.5" stroke-dasharray="1 17" stroke-linecap="round"/>

  <!-- Floor shadow + plate -->
  <ellipse cx="300" cy="500" rx="235" ry="24" fill="url(#floorShadow)"/>
  <ellipse cx="300" cy="468" rx="213" ry="28" fill="url(#plate)" stroke="#DEC9AC" stroke-width="3"/>
  <ellipse cx="300" cy="463" rx="170" ry="19" fill="#FDF6EA" stroke="#E9DCC6" stroke-width="2"/>

  <!-- Pineapple wedge behind -->
  <g transform="translate(448 262) rotate(17)" filter="url(#soft)">
    <path d="M0 0 L84 -45 A99 99 0 0 1 103 47 Z" fill="#F8CE6A" stroke="#D3A03F" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M16 -5 L73 -32 M20 12 L90 -2 M16 29 L72 27" stroke="#D3A03F" stroke-width="4"/>
    <path d="M8 -3 L40 8 M6 8 L34 14" stroke="#FBE58C" stroke-width="3" opacity="0.9"/>
    <path d="M-7 2 l-16 -13 M-9 13 l-18 -4 M-9 -9 l-18 2" stroke="#5F7A3E" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Cookies -->
  <g stroke="#8A5522" stroke-width="3.5">
    <circle cx="168" cy="326" r="47" fill="url(#cookie)"/><circle cx="168" cy="326" r="47" fill="url(#cookieEdge)" stroke="none"/>
    <circle cx="285" cy="265" r="51" fill="url(#cookie)"/><circle cx="285" cy="265" r="51" fill="url(#cookieEdge)" stroke="none"/>
    <circle cx="400" cy="318" r="47" fill="url(#cookie)"/><circle cx="400" cy="318" r="47" fill="url(#cookieEdge)" stroke="none"/>
    <circle cx="207" cy="430" r="45" fill="url(#cookie)"/><circle cx="207" cy="430" r="45" fill="url(#cookieEdge)" stroke="none"/>
    <circle cx="386" cy="430" r="45" fill="url(#cookie)"/><circle cx="386" cy="430" r="45" fill="url(#cookieEdge)" stroke="none"/>
  </g>
  <!-- Glaze highlights -->
  <g stroke="#FFF6CC" stroke-width="5" stroke-linecap="round" opacity="0.9" fill="none">
    <path d="M146 304 a31 31 0 0 1 28 -20"/>
    <path d="M262 240 a36 36 0 0 1 31 -17"/>
    <path d="M378 297 a31 31 0 0 1 28 -18"/>
    <path d="M187 409 a29 29 0 0 1 25 -17"/>
    <path d="M363 409 a29 29 0 0 1 25 -17"/>
  </g>
  <!-- Fork-cross marks + clove dots -->
  <g stroke="#8A5522" stroke-width="3.4" stroke-linecap="round">
    <path d="M158 322 l20 8 M162 330 l16 -14"/>
    <path d="M275 260 l20 8 M279 268 l16 -14"/>
    <path d="M390 314 l20 8 M394 322 l16 -14"/>
  </g>
  <g fill="#5E3A1C"><circle cx="172" cy="336" r="2.6"/><circle cx="289" cy="274" r="2.6"/><circle cx="404" cy="327" r="2.6"/><circle cx="211" cy="436" r="2.4"/><circle cx="390" cy="438" r="2.4"/></g>

  <!-- Half cookie showing jam -->
  <g transform="translate(298 445)" filter="url(#soft)">
    <circle r="52" fill="url(#cookie)" stroke="#8A5522" stroke-width="3.5"/>
    <circle r="52" fill="url(#cookieEdge)"/>
    <circle r="30" fill="url(#jam)" stroke="#4E120C" stroke-width="3"/>
    <path d="M-16 -8 a18 15 0 0 1 23 -8 M-15 7 a17 13 0 0 0 17 9" stroke="#F08A6C" stroke-width="3.4" fill="none" stroke-linecap="round" opacity="0.9"/>
    <circle cx="-7" cy="-4" r="2" fill="#3E0D07"/><circle cx="8" cy="7" r="2" fill="#3E0D07"/><circle cx="5" cy="-9" r="1.5" fill="#3E0D07"/>
  </g>

  <!-- Sparkle -->
  <polygon points="132,196 135.5,206.5 146.5,206.5 137.5,213 141,224 132,216.8 123,224 126.5,213 117.5,206.5 128.5,206.5" fill="#E4B15A"/>
</svg>
