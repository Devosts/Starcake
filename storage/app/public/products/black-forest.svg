<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%">
      <stop offset="0" stop-color="#FFFDF6"/>
      <stop offset="0.7" stop-color="#F8EBD6"/>
      <stop offset="1" stop-color="#EDD9BC"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="46" height="46" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="2.1" fill="#E3CDA9" opacity="0.85"/>
    </pattern>
    <linearGradient id="sponge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#52301F"/>
      <stop offset="0.5" stop-color="#402716"/>
      <stop offset="1" stop-color="#2B1A0E"/>
    </linearGradient>
    <linearGradient id="glaze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B0D05"/>
      <stop offset="1" stop-color="#38210F"/>
    </linearGradient>
    <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF9EE"/>
      <stop offset="1" stop-color="#EDDDC8"/>
    </linearGradient>
    <radialGradient id="cherry" cx="36%" cy="32%" r="75%">
      <stop offset="0" stop-color="#E4755C"/>
      <stop offset="0.4" stop-color="#C0432F"/>
      <stop offset="1" stop-color="#741F14"/>
    </radialGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F0E4D2"/>
    </linearGradient>
    <radialGradient id="floorShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#3A2415" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#3A2415" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="bodyClip"><rect x="166" y="240" width="268" height="200" rx="15"/></clipPath>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.3"/></filter>
  </defs>

  <rect width="600" height="600" fill="url(#bg)"/>
  <rect width="600" height="600" fill="url(#dots)"/>
  <circle cx="300" cy="298" r="198" fill="none" stroke="#DEC49C" stroke-width="3.5" stroke-dasharray="1 17" stroke-linecap="round"/>

  <!-- Floor shadow -->
  <ellipse cx="300" cy="492" rx="225" ry="30" fill="url(#floorShadow)"/>

  <!-- Stand + plate -->
  <ellipse cx="300" cy="452" rx="201" ry="27" fill="url(#plate)" stroke="#DEC9AC" stroke-width="3"/>
  <ellipse cx="300" cy="446.5" rx="163" ry="18" fill="#FDF6EA" stroke="#E9DCC6" stroke-width="2"/>
  <rect x="284" y="462" width="32" height="38" fill="#EFE2CC" stroke="#DEC9AC" stroke-width="3"/>
  <ellipse cx="300" cy="508" rx="90" ry="12" fill="url(#plate)" stroke="#DEC9AC" stroke-width="3"/>

  <!-- Cake body -->
  <g clip-path="url(#bodyClip)">
    <rect x="166" y="240" width="268" height="200" fill="url(#sponge)"/>
    <!-- side light -->
    <rect x="190" y="240" width="40" height="200" fill="#FFFFFF" opacity="0.07"/>
    <rect x="380" y="240" width="54" height="200" fill="#000000" opacity="0.18"/>
    <!-- cream layers -->
    <rect x="166" y="308" width="268" height="16" fill="url(#cream)"/>
    <rect x="166" y="378" width="268" height="16" fill="url(#cream)"/>
    <!-- sponge texture -->
    <g fill="#6B4430" opacity="0.85">
      <circle cx="212" cy="286" r="2.6"/><circle cx="268" cy="274" r="2.3"/><circle cx="330" cy="290" r="2.6"/><circle cx="392" cy="280" r="2.3"/><circle cx="240" cy="296" r="1.7"/><circle cx="356" cy="270" r="1.7"/>
      <circle cx="228" cy="350" r="2.6"/><circle cx="300" cy="344" r="2.3"/><circle cx="372" cy="352" r="2.6"/><circle cx="262" cy="358" r="1.7"/>
      <circle cx="208" cy="414" r="2.6"/><circle cx="282" cy="420" r="2.3"/><circle cx="352" cy="412" r="2.6"/><circle cx="404" cy="420" r="2.3"/><circle cx="250" cy="404" r="1.7"/>
    </g>
  </g>
  <rect x="166" y="240" width="268" height="200" rx="15" fill="none" stroke="#1D0F07" stroke-width="4.5" opacity="0.4"/>

  <!-- Glaze with drips -->
  <path d="M166 254 a15 15 0 0 1 15 -14 h238 a15 15 0 0 1 15 14 v10 h-268 Z" fill="url(#glaze)"/>
  <ellipse cx="196" cy="268" rx="9" ry="16" fill="url(#glaze)"/>
  <ellipse cx="234" cy="270" rx="6.5" ry="11" fill="url(#glaze)"/>
  <ellipse cx="270" cy="268" rx="11.5" ry="21" fill="url(#glaze)"/>
  <ellipse cx="308" cy="270" rx="7.5" ry="12.5" fill="url(#glaze)"/>
  <ellipse cx="346" cy="268" rx="10.5" ry="18" fill="url(#glaze)"/>
  <ellipse cx="384" cy="270" rx="7" ry="11.5" fill="url(#glaze)"/>
  <ellipse cx="414" cy="268" rx="9" ry="14" fill="url(#glaze)"/>
  <!-- glaze shine -->
  <path d="M180 246 h96" stroke="#5C3A22" stroke-width="4" stroke-linecap="round" opacity="0.8"/>

  <!-- Dollops with depth -->
  <g filter="url(#soft)" fill="url(#cream)" stroke="#DFCDAF" stroke-width="2.5">
    <circle cx="188" cy="228" r="15"/><circle cx="228" cy="225" r="16.5"/><circle cx="266" cy="228" r="15"/>
    <circle cx="304" cy="224" r="17.5"/><circle cx="342" cy="228" r="15"/><circle cx="380" cy="225" r="16.5"/><circle cx="416" cy="228" r="14"/>
  </g>
  <g fill="#D8C4A4" opacity="0.7">
    <circle cx="193" cy="234" r="6"/><circle cx="233" cy="231" r="6"/><circle cx="271" cy="234" r="5.5"/><circle cx="309" cy="230" r="6.5"/><circle cx="347" cy="234" r="5.5"/><circle cx="385" cy="231" r="6"/><circle cx="420" cy="234" r="5"/>
  </g>

  <!-- Cherries -->
  <g stroke-linecap="round">
    <path d="M228 208 q4 -14 14 -19" stroke="#33200F" stroke-width="3" fill="none"/>
    <path d="M304 204 q4 -14 14 -19" stroke="#33200F" stroke-width="3" fill="none"/>
    <path d="M380 208 q4 -14 14 -19" stroke="#33200F" stroke-width="3" fill="none"/>
    <circle cx="228" cy="212" r="10.5" fill="url(#cherry)"/><circle cx="224.5" cy="208.5" r="2.8" fill="#FFFFFF" opacity="0.85"/>
    <circle cx="304" cy="208" r="10.5" fill="url(#cherry)"/><circle cx="300.5" cy="204.5" r="2.8" fill="#FFFFFF" opacity="0.85"/>
    <circle cx="380" cy="212" r="10.5" fill="url(#cherry)"/><circle cx="376.5" cy="208.5" r="2.8" fill="#FFFFFF" opacity="0.85"/>
  </g>

  <!-- Chocolate shavings -->
  <g fill="#1B0D05" opacity="0.95">
    <rect x="204" y="302" width="19" height="4.6" rx="2.3" transform="rotate(-18 213 304)"/>
    <rect x="292" y="312" width="17" height="4.6" rx="2.3" transform="rotate(12 300 314)"/>
    <rect x="382" y="300" width="18" height="4.6" rx="2.3" transform="rotate(-10 391 302)"/>
    <rect x="238" y="374" width="18" height="4.6" rx="2.3" transform="rotate(14 247 376)"/>
    <rect x="344" y="372" width="19" height="4.6" rx="2.3" transform="rotate(-14 353 374)"/>
  </g>

  <!-- Crumbs + coffee beans on plate -->
  <circle cx="212" cy="447" r="3.2" fill="#402716"/><circle cx="395" cy="449" r="2.6" fill="#402716"/><circle cx="248" cy="443" r="2.1" fill="#402716"/>
  <ellipse cx="342" cy="450" rx="5" ry="3.4" fill="#33200F" transform="rotate(-24 342 450)"/><line x1="338.5" y1="449" x2="345.5" y2="451" stroke="#54301F" stroke-width="1.2" transform="rotate(-24 342 450)"/>

  <!-- Sparkles -->
  <polygon points="132,196 135,205 145,205 137,211 140,221 132,215 124,221 127,211 119,205 129,205" fill="#E4B15A"/>
  <polygon points="472,240 474.5,248 483,248 476.5,253 479,262 472,256.5 465,262 467.5,253 461,248 470,248" fill="#E4B15A" opacity="0.85"/>
</svg>
