<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%">
      <stop offset="0" stop-color="#FFFDF6"/>
      <stop offset="0.7" stop-color="#F8EBD6"/>
      <stop offset="1" stop-color="#EDD9BC"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="46" height="46" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="2.1" fill="#E3CDA9" opacity="0.85"/>
    </pattern>
    <linearGradient id="stick" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8D27A"/>
      <stop offset="0.5" stop-color="#E3AC52"/>
      <stop offset="1" stop-color="#B0722A"/>
    </linearGradient>
    <linearGradient id="cheese" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FADF8C"/>
      <stop offset="1" stop-color="#D9A83E"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F0E4D2"/>
    </linearGradient>
    <radialGradient id="floorShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#3A2415" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#3A2415" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity="0.35"/></filter>
  </defs>

  <rect width="600" height="600" fill="url(#bg)"/>
  <rect width="600" height="600" fill="url(#dots)"/>
  <circle cx="300" cy="298" r="198" fill="none" stroke="#DEC49C" stroke-width="3.5" stroke-dasharray="1 17" stroke-linecap="round"/>

  <!-- Floor shadow + plate -->
  <ellipse cx="300" cy="498" rx="240" ry="24" fill="url(#floorShadow)"/>
  <ellipse cx="300" cy="466" rx="219" ry="28" fill="url(#plate)" stroke="#DEC9AC" stroke-width="3"/>
  <ellipse cx="300" cy="461" rx="176" ry="19" fill="#FDF6EA" stroke="#E9DCC6" stroke-width="2"/>

  <!-- Cheese wedge -->
  <g transform="translate(116 326)" filter="url(#soft)">
    <path d="M0 62 L102 -36 L102 62 Z" fill="url(#cheese)" stroke="#A8791F" stroke-width="3.5" stroke-linejoin="round"/>
    <circle cx="72" cy="27" r="8" fill="#C99A34"/><circle cx="90" cy="46" r="5.5" fill="#C99A34"/><circle cx="50" cy="43" r="4.5" fill="#C99A34"/><circle cx="82" cy="8" r="5" fill="#C99A34"/>
    <path d="M9 49 L94 -28" stroke="#FFF3C4" stroke-width="4.5" opacity="0.85"/>
    <path d="M24 54 L102 -16" stroke="#F2C86E" stroke-width="2.5" opacity="0.7"/>
  </g>

  <!-- Leaning stack, right back -->
  <g transform="translate(428 258) rotate(-24)" filter="url(#soft)">
    <rect x="-80" y="-23" width="160" height="46" rx="23" fill="url(#stick)" stroke="#7C4E1F" stroke-width="3.5"/>
    <rect x="-46" y="-24" width="11" height="11" fill="#FFF0B0" transform="rotate(20)"/>
    <circle cx="18" cy="-6" r="3.6" fill="#8A5522" opacity="0.75"/><circle cx="-17" cy="7" r="3.2" fill="#8A5522" opacity="0.75"/><circle cx="42" cy="5" r="2.8" fill="#8A5522" opacity="0.6"/>
  </g>
  <g transform="translate(442 322) rotate(-8)" filter="url(#soft)">
    <rect x="-80" y="-23" width="160" height="46" rx="23" fill="url(#stick)" stroke="#7C4E1F" stroke-width="3.5"/>
    <rect x="-41" y="-23" width="10" height="10" fill="#FFF0B0" transform="rotate(-14)"/><rect x="31" y="9" width="10" height="10" fill="#FFF0B0" transform="rotate(30)"/>
    <circle cx="6" cy="-5" r="3.6" fill="#8A5522" opacity="0.75"/><circle cx="-27" cy="7" r="3.2" fill="#8A5522" opacity="0.75"/>
  </g>
  <g transform="translate(434 386) rotate(10)" filter="url(#soft)">
    <rect x="-80" y="-23" width="160" height="46" rx="23" fill="url(#stick)" stroke="#7C4E1F" stroke-width="3.5"/>
    <circle cx="-13" cy="-4" r="3.6" fill="#8A5522" opacity="0.75"/><circle cx="30" cy="6" r="3.2" fill="#8A5522" opacity="0.75"/>
    <rect x="8" y="-24" width="11" height="11" fill="#FFF0B0" transform="rotate(18)"/>
  </g>

  <!-- Front row -->
  <g transform="translate(196 288) rotate(-6)" filter="url(#soft)"><rect x="-76" y="-20" width="152" height="40" rx="20" fill="url(#stick)" stroke="#7C4E1F" stroke-width="3.5"/><circle cx="-25" cy="-2" r="3.4" fill="#8A5522" opacity="0.75"/><circle cx="28" cy="4" r="3.8" fill="#8A5522" opacity="0.75"/><rect x="-4" y="-21" width="10" height="10" fill="#FFF0B0" transform="rotate(22)"/></g>
  <g transform="translate(214 354) rotate(4)" filter="url(#soft)"><rect x="-76" y="-20" width="152" height="40" rx="20" fill="url(#stick)" stroke="#7C4E1F" stroke-width="3.5"/><circle cx="-31" cy="3" r="3.1" fill="#8A5522" opacity="0.75"/><circle cx="22" cy="-4" r="3.6" fill="#8A5522" opacity="0.75"/><rect x="-18" y="9" width="10" height="10" fill="#FFF0B0" transform="rotate(-20)"/></g>
  <g transform="translate(230 422) rotate(-3)" filter="url(#soft)"><rect x="-79" y="-21" width="158" height="42" rx="21" fill="url(#stick)" stroke="#7C4E1F" stroke-width="3.5"/><circle cx="-8" cy="-5" r="3.5" fill="#8A5522" opacity="0.75"/><circle cx="38" cy="6" r="3.2" fill="#8A5522" opacity="0.75"/><rect x="-35" y="-22" width="10" height="10" fill="#FFF0B0" transform="rotate(15)"/><rect x="17" y="10" width="10" height="10" fill="#FFF0B0" transform="rotate(-24)"/></g>

  <!-- Sparkle -->
  <polygon points="470,140 473.5,150.5 484.5,150.5 475.5,157 479,168 470,160.8 461,168 464.5,157 455.5,150.5 466.5,150.5" fill="#E4B15A"/>
</svg>
