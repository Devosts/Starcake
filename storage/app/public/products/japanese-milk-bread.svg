<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%">
      <stop offset="0" stop-color="#FFFDF6"/>
      <stop offset="0.7" stop-color="#F8EBD6"/>
      <stop offset="1" stop-color="#EDD9BC"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="46" height="46" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="2.1" fill="#E3CDA9" opacity="0.85"/>
    </pattern>
    <linearGradient id="crust" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFDF4"/>
      <stop offset="0.55" stop-color="#F7ECD2"/>
      <stop offset="1" stop-color="#E3CFA0"/>
    </linearGradient>
    <linearGradient id="crustSlice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6E3B4"/>
      <stop offset="1" stop-color="#D8BC82"/>
    </linearGradient>
    <radialGradient id="interior" cx="50%" cy="42%" r="75%">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FBF2DC"/>
    </radialGradient>
    <radialGradient id="floorShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#3A2415" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#3A2415" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity="0.3"/></filter>
  </defs>

  <rect width="600" height="600" fill="url(#bg)"/>
  <rect width="600" height="600" fill="url(#dots)"/>
  <circle cx="300" cy="298" r="198" fill="none" stroke="#DEC49C" stroke-width="3.5" stroke-dasharray="1 17" stroke-linecap="round"/>

  <!-- Steam -->
  <path d="M238 150 q12 -17 0 -30 q-10 -13 3 -26" fill="none" stroke="#BE9868" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
  <path d="M300 134 q12 -17 0 -30 q-10 -13 3 -26" fill="none" stroke="#BE9868" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
  <path d="M362 150 q12 -17 0 -30 q-10 -13 3 -26" fill="none" stroke="#BE9868" stroke-width="6" stroke-linecap="round" opacity="0.8"/>

  <!-- Linen cloth, bottom left -->
  <path d="M0 500 L0 600 L192 600 L0 500 Z" fill="#A93B38"/>
  <path d="M0 540 L120 600 M0 566 L158 600" stroke="#D9837E" stroke-width="7" opacity="0.85"/>
  <path d="M58 600 L142 516" stroke="#D9837E" stroke-width="7" opacity="0.85"/>
  <path d="M0 512 L184 512" stroke="#7E2A27" stroke-width="3" opacity="0.6"/>

  <!-- Floor shadow -->
  <ellipse cx="300" cy="478" rx="208" ry="19" fill="url(#floorShadow)"/>

  <!-- Loaf -->
  <g filter="url(#soft)">
    <rect x="152" y="252" width="296" height="192" rx="60" fill="url(#crust)" stroke="#D8BD8E" stroke-width="4"/>
    <path d="M226 268 l36 27 M282 261 l36 27 M338 263 l36 27" stroke="#DCC28F" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M172 388 q128 44 256 0" stroke="#E5D3A4" stroke-width="6" fill="none" opacity="0.95"/>
    <path d="M180 300 q120 -22 240 0" stroke="#FFFFFF" stroke-width="5" fill="none" opacity="0.75"/>
  </g>

  <!-- Slice standing in front -->
  <g transform="translate(300 462)" filter="url(#soft)">
    <rect x="-100" y="-58" width="200" height="124" rx="30" fill="url(#crustSlice)" stroke="#B99B60" stroke-width="4"/>
    <rect x="-81" y="-40" width="162" height="88" rx="21" fill="url(#interior)"/>
    <path d="M-46 -9 q23 15 46 0 q23 -15 46 0" fill="none" stroke="#EFE0BE" stroke-width="6" stroke-linecap="round"/>
    <path d="M-46 17 q23 15 46 0 q23 -15 46 0" fill="none" stroke="#EFE0BE" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
  </g>

  <!-- Flour dusting -->
  <g fill="#FFFFFF" opacity="0.95">
    <circle cx="208" cy="300" r="2.8"/><circle cx="266" cy="283" r="2.2"/><circle cx="330" cy="291" r="2.6"/><circle cx="390" cy="306" r="2.2"/>
    <circle cx="236" cy="338" r="1.9"/><circle cx="302" cy="330" r="1.9"/><circle cx="368" cy="339" r="1.9"/><circle cx="268" cy="312" r="1.5"/><circle cx="346" cy="310" r="1.5"/>
  </g>

  <!-- Sparkle -->
  <polygon points="452,196 455.5,206.5 466.5,206.5 457.5,213 461,224 452,216.8 443,224 446.5,213 437.5,206.5 448.5,206.5" fill="#E4B15A"/>
</svg>
