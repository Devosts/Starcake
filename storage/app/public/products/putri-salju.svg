<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%">
      <stop offset="0" stop-color="#FFFDF6"/>
      <stop offset="0.7" stop-color="#F8EBD6"/>
      <stop offset="1" stop-color="#EDD9BC"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="46" height="46" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="2.1" fill="#E3CDA9" opacity="0.85"/>
    </pattern>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8E8BC"/>
      <stop offset="0.55" stop-color="#E2C68E"/>
      <stop offset="1" stop-color="#B99B5E"/>
    </linearGradient>
    <linearGradient id="sugar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EFE6D2"/>
    </linearGradient>
    <radialGradient id="floorShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#3A2415" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#3A2415" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F0E4D2"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity="0.35"/></filter>
  </defs>

  <rect width="600" height="600" fill="url(#bg)"/>
  <rect width="600" height="600" fill="url(#dots)"/>
  <circle cx="300" cy="298" r="198" fill="none" stroke="#DEC49C" stroke-width="3.5" stroke-dasharray="1 17" stroke-linecap="round"/>

  <!-- Floor shadow + plate -->
  <ellipse cx="300" cy="496" rx="238" ry="23" fill="url(#floorShadow)"/>
  <ellipse cx="300" cy="458" rx="217" ry="28" fill="url(#plate)" stroke="#DEC9AC" stroke-width="3"/>
  <ellipse cx="300" cy="453" rx="174" ry="19" fill="#FDF6EA" stroke="#E9DCC6" stroke-width="2"/>

  <!-- Powdered-sugar mound with small sieve -->
  <g transform="translate(132 428)" filter="url(#soft)">
    <path d="M-58 12 A60 52 0 0 1 58 12 Z" fill="url(#sugar)" stroke="#DACFB8" stroke-width="3"/>
    <circle cx="-18" cy="-6" r="4.5" fill="#FFFFFF"/><circle cx="8" cy="-18" r="3.6" fill="#FFFFFF"/><circle cx="26" cy="-2" r="3" fill="#FFFFFF"/>
  </g>

  <!-- Crescents -->
  <g stroke="#A98B4E" stroke-width="3.5" stroke-linejoin="round" filter="url(#soft)">
    <path transform="translate(213 268) rotate(-16)" d="M-60 11 a62 60 0 1 1 120 0 a46 42 0 1 0 -120 0 Z" fill="url(#body)"/>
    <path transform="translate(395 264) rotate(15)" d="M-60 11 a62 60 0 1 1 120 0 a46 42 0 1 0 -120 0 Z" fill="url(#body)"/>
    <path transform="translate(302 352)" d="M-67 12 a69 66 0 1 1 134 0 a50 46 0 1 0 -134 0 Z" fill="url(#body)"/>
    <path transform="translate(180 394) rotate(25) scale(0.9)" d="M-58 10 a60 58 0 1 1 116 0 a44 40 0 1 0 -116 0 Z" fill="url(#body)"/>
    <path transform="translate(428 394) rotate(-23) scale(0.9)" d="M-58 10 a60 58 0 1 1 116 0 a44 40 0 1 0 -116 0 Z" fill="url(#body)"/>
  </g>

  <!-- Thick sugar coating clusters -->
  <g fill="#FFFDF6">
    <circle cx="168" cy="236" r="11"/><circle cx="197" cy="215" r="13"/><circle cx="232" cy="206" r="12"/><circle cx="260" cy="224" r="9.5"/>
    <circle cx="352" cy="215" r="9.5"/><circle cx="385" cy="199" r="13"/><circle cx="421" cy="202" r="12"/><circle cx="449" cy="229" r="9.5"/>
    <circle cx="249" cy="312" r="13"/><circle cx="287" cy="287" r="14"/><circle cx="327" cy="285" r="14"/><circle cx="363" cy="309" r="12"/>
    <circle cx="143" cy="363" r="9.5"/><circle cx="175" cy="344" r="10.5"/><circle cx="218" cy="358" r="9"/>
    <circle cx="455" cy="361" r="9.5"/><circle cx="421" cy="344" r="10.5"/><circle cx="381" cy="359" r="9"/>
  </g>

  <!-- Falling sugar dust -->
  <g fill="#FFFFFF">
    <circle cx="250" cy="146" r="3.6"/><circle cx="318" cy="112" r="2.7"/><circle cx="372" cy="150" r="3.1"/><circle cx="300" cy="176" r="2.3"/><circle cx="210" cy="172" r="2.5"/><circle cx="414" cy="182" r="2.3"/><circle cx="282" cy="130" r="1.8"/>
  </g>

  <!-- Sparkle -->
  <polygon points="470,140 473.5,150.5 484.5,150.5 475.5,157 479,168 470,160.8 461,168 464.5,157 455.5,150.5 466.5,150.5" fill="#E4B15A"/>
</svg>
