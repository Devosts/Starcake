<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%">
      <stop offset="0" stop-color="#FFFDF6"/>
      <stop offset="0.7" stop-color="#F8EBD6"/>
      <stop offset="1" stop-color="#EDD9BC"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="46" height="46" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="2.1" fill="#E3CDA9" opacity="0.85"/>
    </pattern>
    <radialGradient id="dome" cx="42%" cy="30%" r="80%">
      <stop offset="0" stop-color="#96602F"/>
      <stop offset="0.55" stop-color="#71462A"/>
      <stop offset="1" stop-color="#4E2C15"/>
    </radialGradient>
    <radialGradient id="domeInner" cx="50%" cy="45%" r="75%">
      <stop offset="0" stop-color="#B9834F"/>
      <stop offset="1" stop-color="#8A5A33"/>
    </radialGradient>
    <linearGradient id="cup" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E0BC7E"/>
      <stop offset="0.5" stop-color="#C99B58"/>
      <stop offset="1" stop-color="#9E7439"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F0E4D2"/>
    </linearGradient>
    <radialGradient id="floorShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#3A2415" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#3A2415" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="domeClip"><path d="M202 356 A106 106 0 0 1 414 356 Z"/></clipPath>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity="0.35"/></filter>
  </defs>

  <rect width="600" height="600" fill="url(#bg)"/>
  <rect width="600" height="600" fill="url(#dots)"/>
  <circle cx="300" cy="298" r="198" fill="none" stroke="#DEC49C" stroke-width="3.5" stroke-dasharray="1 17" stroke-linecap="round"/>

  <!-- Steam -->
  <path d="M238 172 q12 -17 0 -30 q-10 -13 3 -26" fill="none" stroke="#BE9868" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
  <path d="M306 156 q12 -17 0 -30 q-10 -13 3 -26" fill="none" stroke="#BE9868" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
  <path d="M372 174 q12 -17 0 -30 q-10 -13 3 -26" fill="none" stroke="#BE9868" stroke-width="6" stroke-linecap="round" opacity="0.8"/>

  <!-- Floor shadow + plate -->
  <ellipse cx="300" cy="500" rx="240" ry="24" fill="url(#floorShadow)"/>
  <ellipse cx="300" cy="476" rx="217" ry="27" fill="url(#plate)" stroke="#DEC9AC" stroke-width="3"/>
  <ellipse cx="300" cy="471" rx="173" ry="18" fill="#FDF6EA" stroke="#E9DCC6" stroke-width="2"/>

  <!-- Side cakes -->
  <g transform="translate(128 421) scale(0.6)" filter="url(#soft)">
    <path d="M-74 -6 A76 70 0 0 1 74 -6 Z" fill="url(#dome)" stroke="#3A2210" stroke-width="4"/>
    <path d="M-60 2 L-47 96 L47 96 L60 2 Z" fill="url(#cup)" stroke="#7E5A28" stroke-width="4" stroke-linejoin="round"/>
    <path d="M-31 8 L-23 90 M0 10 L0 92 M31 8 L23 90" stroke="#7E5A28" stroke-width="4"/>
    <path d="M-40 -34 A45 41 0 0 1 40 -34 L19 -8 L0 -31 L-19 -8 Z" fill="url(#domeInner)" opacity="0.95"/>
    <circle cx="0" cy="-38" r="7" fill="#3A2210"/>
  </g>
  <g transform="translate(476 421) scale(0.6)" filter="url(#soft)">
    <path d="M-74 -6 A76 70 0 0 1 74 -6 Z" fill="url(#dome)" stroke="#3A2210" stroke-width="4"/>
    <path d="M-60 2 L-47 96 L47 96 L60 2 Z" fill="url(#cup)" stroke="#7E5A28" stroke-width="4" stroke-linejoin="round"/>
    <path d="M-31 8 L-23 90 M0 10 L0 92 M31 8 L23 90" stroke="#7E5A28" stroke-width="4"/>
    <path d="M-40 -34 A45 41 0 0 1 40 -34 L19 -8 L0 -31 L-19 -8 Z" fill="url(#domeInner)" opacity="0.95"/>
    <circle cx="0" cy="-38" r="7" fill="#3A2210"/>
  </g>

  <!-- Main cup -->
  <g filter="url(#soft)">
    <path d="M198 356 L226 482 L390 482 L418 356 Z" fill="url(#cup)" stroke="#7E5A28" stroke-width="4" stroke-linejoin="round"/>
    <path d="M246 372 L258 466 M283 375 L289 470 M322 375 L316 470 M362 372 L350 466" stroke="#7E5A28" stroke-width="4.5" stroke-linecap="round"/>
  </g>

  <!-- Mekar dome -->
  <path d="M202 356 A106 106 0 0 1 414 356 Z" fill="url(#dome)" stroke="#3A2210" stroke-width="4.5" stroke-linejoin="round"/>
  <g clip-path="url(#domeClip)">
    <path d="M308 172 L262 356 L356 356 Z" fill="url(#domeInner)"/>
    <path d="M308 172 L198 322 L260 356 Z" fill="url(#domeInner)" opacity="0.75"/>
    <path d="M308 172 L420 322 L358 356 Z" fill="url(#domeInner)" opacity="0.75"/>
    <circle cx="308" cy="192" r="14" fill="#33200F"/>
    <circle cx="304" cy="188" r="4.5" fill="#5E3A22"/>
  </g>
  <path d="M236 300 q40 -18 70 -8" stroke="#B9834F" stroke-width="4" fill="none" opacity="0.6" stroke-linecap="round"/>

  <!-- Gula merah cubes -->
  <g transform="rotate(-8 214 456)"><rect x="196" y="442" width="37" height="27" rx="5" fill="#5E3A1C" stroke="#33200F" stroke-width="2.5"/><path d="M201 452 L228 452" stroke="#8A5A33" stroke-width="3"/></g>
  <g transform="rotate(10 398 454)"><rect x="380" y="440" width="35" height="25" rx="5" fill="#6B452A" stroke="#33200F" stroke-width="2.5"/><path d="M385 450 L410 450" stroke="#96602F" stroke-width="3"/></g>

  <!-- Leaf accent -->
  <path d="M296 492 q64 -22 104 8 q-60 17 -104 -8 Z" fill="#5F7A3E" opacity="0.95"/>
  <path d="M312 491 q44 -9 80 4" stroke="#3E5228" stroke-width="2.5" fill="none"/>

  <!-- Sparkle -->
  <polygon points="470,158 473.5,168.5 484.5,168.5 475.5,175 479,186 470,178.8 461,186 464.5,175 455.5,168.5 466.5,168.5" fill="#E4B15A"/>
</svg>
