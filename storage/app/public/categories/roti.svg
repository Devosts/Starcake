<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%">
      <stop offset="0" stop-color="#FFFDF6"/>
      <stop offset="0.7" stop-color="#F8EBD6"/>
      <stop offset="1" stop-color="#EDD9BC"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="46" height="46" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="2.1" fill="#E3CDA9" opacity="0.85"/>
    </pattern>
    <linearGradient id="loaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFDF4"/>
      <stop offset="0.55" stop-color="#F7ECD2"/>
      <stop offset="1" stop-color="#DEC99E"/>
    </linearGradient>
    <linearGradient id="loafSlice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6E3B4"/>
      <stop offset="1" stop-color="#D0B274"/>
    </linearGradient>
    <radialGradient id="interior" cx="50%" cy="42%" r="75%">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FBF2DC"/>
    </radialGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F0E4D2"/>
    </linearGradient>
    <radialGradient id="floorShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#3A2415" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#3A2415" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity="0.35"/></filter>
  </defs>

  <rect width="600" height="600" fill="url(#bg)"/>
  <rect width="600" height="600" fill="url(#dots)"/>

  <!-- Sparkles -->
  <polygon points="116,164 120.5,177 135,177 123.5,186 128,200 116,190.5 104,200 108.5,186 97,177 111.5,177" fill="#E4B15A"/>
  <polygon points="494,244 497.5,254.5 508.5,254.5 499.5,261 503,272 494,264.8 485,272 488.5,261 479.5,254.5 490.5,254.5" fill="#E4B15A" opacity="0.85"/>

  <!-- Floor shadow + plate -->
  <ellipse cx="300" cy="492" rx="240" ry="23" fill="url(#floorShadow)"/>
  <ellipse cx="300" cy="450" rx="234" ry="28" fill="url(#plate)" stroke="#DEC9AC" stroke-width="4"/>
  <ellipse cx="300" cy="444" rx="190" ry="19" fill="#FDF6EA" stroke="#E9DCC6" stroke-width="2.5"/>

  <!-- Whole loaf -->
  <g transform="translate(320 292) rotate(-4)" filter="url(#soft)">
    <rect x="-152" y="-90" width="304" height="180" rx="60" fill="url(#loaf)" stroke="#D8BD8E" stroke-width="4.5"/>
    <path d="M-80 -66 l32 26 M-20 -73 l32 26 M40 -71 l32 26" stroke="#DCC28F" stroke-width="9" stroke-linecap="round" fill="none"/>
    <path d="M-132 36 q132 40 264 0" stroke="#E5D3A4" stroke-width="6" fill="none" opacity="0.95"/>
    <path d="M-120 -22 q120 -20 240 0" stroke="#FFFFFF" stroke-width="5" fill="none" opacity="0.8"/>
  </g>

  <!-- Slices in front -->
  <g transform="translate(146 396) rotate(-10)" filter="url(#soft)">
    <rect x="-66" y="-74" width="132" height="148" rx="23" fill="url(#loafSlice)" stroke="#B99B60" stroke-width="4"/>
    <rect x="-48" y="-54" width="96" height="108" rx="16" fill="url(#interior)"/>
    <path d="M-28 -12 q19 12 38 0 q19 -12 38 0 M-28 15 q19 12 38 0 q19 -12 38 0" stroke="#EFE0BE" stroke-width="5.5" fill="none" stroke-linecap="round"/>
  </g>
  <g transform="translate(452 398) rotate(11)" filter="url(#soft)">
    <rect x="-66" y="-74" width="132" height="148" rx="23" fill="url(#loafSlice)" stroke="#B99B60" stroke-width="4"/>
    <rect x="-48" y="-54" width="96" height="108" rx="16" fill="url(#interior)"/>
    <path d="M-28 -12 q19 12 38 0 q19 -12 38 0 M-28 15 q19 12 38 0 q19 -12 38 0" stroke="#EFE0BE" stroke-width="5.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Flour dusting -->
  <g fill="#FFFFFF" opacity="0.95">
    <circle cx="258" cy="216" r="2.7"/><circle cx="322" cy="204" r="2.3"/><circle cx="380" cy="220" r="2.5"/><circle cx="298" cy="240" r="1.9"/><circle cx="344" cy="238" r="1.6"/>
  </g>
</svg>
