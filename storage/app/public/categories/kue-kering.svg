<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%">
      <stop offset="0" stop-color="#FFFDF6"/>
      <stop offset="0.7" stop-color="#F8EBD6"/>
      <stop offset="1" stop-color="#EDD9BC"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="46" height="46" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="2.1" fill="#E3CDA9" opacity="0.85"/>
    </pattern>
    <radialGradient id="cookie" cx="42%" cy="36%" r="72%">
      <stop offset="0" stop-color="#FBE58C"/>
      <stop offset="0.55" stop-color="#EAB85C"/>
      <stop offset="1" stop-color="#B57A2E"/>
    </radialGradient>
    <linearGradient id="stick" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8D27A"/>
      <stop offset="0.5" stop-color="#E3AC52"/>
      <stop offset="1" stop-color="#B0722A"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F0E4D2"/>
    </linearGradient>
    <radialGradient id="floorShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#3A2415" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#3A2415" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity="0.35"/></filter>
  </defs>

  <rect width="600" height="600" fill="url(#bg)"/>
  <rect width="600" height="600" fill="url(#dots)"/>

  <!-- Sparkles -->
  <polygon points="108,150 112.5,163 127,163 115.5,172 120,186 108,176.5 96,186 100.5,172 89,163 103.5,163" fill="#E4B15A"/>
  <polygon points="494,190 497.5,200.5 508.5,200.5 499.5,207 503,218 494,210.8 485,218 488.5,207 479.5,200.5 490.5,200.5" fill="#E4B15A" opacity="0.85"/>

  <!-- Floor shadow + plate -->
  <ellipse cx="300" cy="492" rx="230" ry="24" fill="url(#floorShadow)"/>
  <ellipse cx="300" cy="436" rx="216" ry="31" fill="url(#plate)" stroke="#DEC9AC" stroke-width="4"/>
  <ellipse cx="300" cy="430" rx="172" ry="21" fill="#FDF6EA" stroke="#E9DCC6" stroke-width="2.5"/>

  <!-- Round cookies -->
  <g filter="url(#soft)">
    <circle cx="190" cy="348" r="53" fill="url(#cookie)" stroke="#8A5522" stroke-width="4"/>
    <circle cx="292" cy="292" r="55" fill="url(#cookie)" stroke="#8A5522" stroke-width="4"/>
  </g>
  <path d="M160 325 a35 35 0 0 1 30 -20 M260 264 a37 37 0 0 1 33 -16" stroke="#FFF6CC" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.9"/>
  <circle cx="190" cy="356" r="5" fill="#5E3A1C"/><circle cx="292" cy="300" r="5" fill="#5E3A1C"/>

  <!-- Crescent -->
  <path transform="translate(412 330) rotate(14)" filter="url(#soft)" d="M-58 11 a60 58 0 1 1 116 0 a44 40 0 1 0 -116 0 Z"
        fill="#F6E8BE" stroke="#A98B4E" stroke-width="4" stroke-linejoin="round"/>
  <g fill="#FFFDF6"><circle cx="368" cy="298" r="11"/><circle cx="400" cy="278" r="13"/><circle cx="436" cy="281" r="12"/><circle cx="462" cy="306" r="9.5"/></g>

  <!-- Cheese sticks -->
  <g transform="translate(230 448) rotate(-8)" filter="url(#soft)"><rect x="-92" y="-23" width="184" height="46" rx="23" fill="url(#stick)" stroke="#7C4E1F" stroke-width="4"/><circle cx="-32" cy="-3" r="4.2" fill="#8A5522" opacity="0.75"/><circle cx="36" cy="4" r="4.6" fill="#8A5522" opacity="0.75"/><rect x="-7" y="-24" width="11" height="11" fill="#FFF0B0" transform="rotate(22)"/></g>
  <g transform="translate(358 456) rotate(6)" filter="url(#soft)"><rect x="-88" y="-22" width="176" height="44" rx="22" fill="url(#stick)" stroke="#7C4E1F" stroke-width="4"/><circle cx="-25" cy="3" r="4.2" fill="#8A5522" opacity="0.75"/><circle cx="27" cy="-4" r="4.4" fill="#8A5522" opacity="0.75"/><rect x="12" y="10" width="10" height="10" fill="#FFF0B0" transform="rotate(-18)"/></g>
</svg>
