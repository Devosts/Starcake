  <path d="M140 470 a74 42 0 0 1 148 0 Z" fill="#33200F" stroke="#6E4526" stroke-width="3" transform="translate(28 -50)"/>
  <path d="M168 452 l26 14 M214 444 l26 14 M262 446 l26 14" stroke="#8A5A33" stroke-width="4.5" stroke-linecap="round"/>
  <ellipse cx="335" cy="532" rx="52" ry="33" fill="url(#loafG)" stroke="#6E4526" stroke-width="3" transform="rotate(-16 335 532)"/>
  <path d="M312 522 l22 10" stroke="#8A5A33" stroke-width="4" stroke-linecap="round" transform="rotate(-16 335 532)"/>

