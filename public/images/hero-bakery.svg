  <g fill="#2A1810" stroke="#5E3F28" stroke-width="2">
    <rect x="120" y="128" width="66" height="68" rx="9"/>
    <rect x="129" y="112" width="48" height="17" rx="5"/>
    <rect x="150" y="152" width="24" height="26" rx="2" fill="#3A2618" stroke="none"/>
    <rect x="262" y="140" width="46" height="56" rx="21"/>
    <circle cx="285" cy="140" r="6" fill="#5E3F28" stroke="none"/>
    <rect x="368" y="118" width="92" height="78" rx="6"/>
    <rect x="386" y="98" width="56" height="20" rx="4"/>
    <rect x="388" y="150" width="52" height="26" rx="2" fill="#3A2618" stroke="none"/>
    <rect x="528" y="136" width="56" height="60" rx="26"/>
    <rect x="640" y="128" width="34" height="68" rx="6"/>
    <path d="M666 96 v32" stroke="#5E3F28" stroke-width="4"/>
    <circle cx="666" cy="88" r="9" fill="#2A1810"/>
    <rect x="950" y="130" width="60" height="66" rx="9"/>
    <rect x="958" y="114" width="44" height="16" rx="5"/>
    <rect x="1068" y="146" width="98" height="50" rx="6"/>
    <rect x="1084" y="126" width="66" height="20" rx="4"/>
    <rect x="1222" y="126" width="52" height="70" rx="24"/>
    <rect x="1330" y="142" width="88" height="54" rx="6"/>
    <rect x="1348" y="122" width="52" height="20" rx="4"/>
  </g>

