    <circle cx="716" cy="452" r="3"/><circle cx="756" cy="456" r="3"/><circle cx="796" cy="458" r="3"/><circle cx="836" cy="456" r="3"/><circle cx="876" cy="452" r="3"/>
    <circle cx="740" cy="384" r="2.6"/><circle cx="776" cy="387" r="2.6"/><circle cx="812" cy="387" r="2.6"/><circle cx="848" cy="384" r="2.6"/>
  </g>
  <!-- Star topper with glow -->
  <polygon points="0,-36 8.6,-11.8 34.3,-11.1 14.2,4.4 21.2,29.2 0,14.4 -21.2,29.2 -14.2,4.4 -34.3,-11.1 -8.6,-11.8"
    transform="translate(800 226)" fill="#FFD166" stroke="#B8741F" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="800" cy="226" r="30" fill="#FFD166" opacity="0.18"/>

  <!-- Floating flour dust -->
  <g fill="#FFE9A8" opacity="0.5">
    <circle cx="560" cy="300" r="2.2"/><circle cx="640" cy="210" r="1.6"/><circle cx="730" cy="150" r="2"/>
    <circle cx="890" cy="180" r="1.6"/><circle cx="980" cy="280" r="2.2"/><circle cx="1050" cy="370" r="1.6"/>
    <circle cx="470" cy="380" r="1.8"/><circle cx="1150" cy="250" r="1.8"/>
  </g>

  <!-- Tiny stars -->
  <g fill="#FFD98A">
    <polygon points="510,170 513,180 523,180 515,186 519,197 510,190 501,197 505,186 497,180 507,180"/>
    <polygon points="1120,140 1123,150 1133,150 1125,156 1129,167 1120,160 1111,167 1115,156 1107,150 1117,150" opacity="0.9"/>
    <polygon points="625,105 627,113 636,113 629,118 632,127 625,122 618,127 621,118 614,113 623,113" opacity="0.6"/>
    <polygon points="1005,225 1007,232 1015,232 1009,237 1011,245 1005,240 999,245 1001,237 995,232 1003,232" opacity="0.6"/>
  </g>

  <!-- Counter -->
  <rect x="0" y="580" width="1600" height="100" fill="url(#counter)"/>
  <rect x="0" y="576" width="1600" height="5" fill="#54382A"/>
  <rect x="0" y="581" width="1600" height="2" fill="#1B0F07"/>
</svg>
