  <ellipse cx="1395" cy="560" rx="175" ry="18" fill="url(#shadowBlur)"/>
  <path d="M1200 508 q30 -44 62 0 q-13 15 -31 15 q-18 0 -31 -15 Z" fill="url(#loafG)" stroke="#6E4526" stroke-width="3"/>
  <path d="M1218 502 q14 -18 28 0" stroke="#6E4526" stroke-width="3.5" fill="none"/>
  <rect x="1338" y="368" width="128" height="158" rx="24" fill="#2E1B0F" stroke="#6E4526" stroke-width="3"/>
  <rect x="1354" y="342" width="96" height="30" rx="11" fill="#3A2618" stroke="#6E4526" stroke-width="3"/>
  <rect x="1366" y="330" width="72" height="14" rx="7" fill="#241409"/>
  <circle cx="1372" cy="438" r="17" fill="#241409" stroke="#8A5A33" stroke-width="2"/>
  <circle cx="1422" cy="462" r="17" fill="#241409" stroke="#8A5A33" stroke-width="2"/>
  <circle cx="1412" cy="408" r="17" fill="#241409" stroke="#8A5A33" stroke-width="2"/>
  <circle cx="1366" cy="434" r="2.4" fill="#8A5A33"/><circle cx="1416" cy="458" r="2.4" fill="#8A5A33"/><circle cx="1406" cy="404" r="2.4" fill="#8A5A33"/>

  <!-- Center: cake stand with the Star Cake three-tier cake -->
