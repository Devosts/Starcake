  <rect x="786" y="468" width="28" height="76" fill="#332114" stroke="#6E4526" stroke-width="3"/>
  <ellipse cx="800" cy="548" rx="102" ry="13" fill="#2E1B0F" stroke="#6E4526" stroke-width="3"/>
  <ellipse cx="800" cy="468" rx="152" ry="15" fill="#332114" stroke="#8A5A33" stroke-width="3"/>

  <g stroke="#7A4E30" stroke-width="3" fill="url(#tier)">
    <rect x="676" y="396" width="248" height="74" rx="11"/>
    <rect x="710" y="326" width="180" height="76" rx="11"/>
    <rect x="744" y="266" width="112" height="66" rx="11"/>
  </g>
  <!-- Tier rim lights -->
  <g stroke="#FFD98A" stroke-width="2.2" opacity="0.65">
    <line x1="686" y1="434" x2="914" y2="434"/>
    <line x1="718" y1="364" x2="882" y2="364"/>
    <line x1="750" y1="300" x2="850" y2="300"/>
