  <g>
    <circle cx="140" cy="102" r="20" fill="url(#bulbGlow)" opacity="0.55"/><circle cx="140" cy="102" r="6" fill="#FFE9A8"/>
    <circle cx="330" cy="117" r="20" fill="url(#bulbGlow)" opacity="0.55"/><circle cx="330" cy="117" r="6" fill="#FFE9A8"/>
    <circle cx="520" cy="80" r="20" fill="url(#bulbGlow)" opacity="0.55"/><circle cx="520" cy="80" r="6" fill="#FFE9A8"/>
    <circle cx="700" cy="98" r="20" fill="url(#bulbGlow)" opacity="0.55"/><circle cx="700" cy="98" r="6" fill="#FFE9A8"/>
    <circle cx="885" cy="92" r="20" fill="url(#bulbGlow)" opacity="0.55"/><circle cx="885" cy="92" r="6" fill="#FFE9A8"/>
    <circle cx="1065" cy="80" r="20" fill="url(#bulbGlow)" opacity="0.55"/><circle cx="1065" cy="80" r="6" fill="#FFE9A8"/>
    <circle cx="1265" cy="86" r="20" fill="url(#bulbGlow)" opacity="0.55"/><circle cx="1265" cy="86" r="6" fill="#FFE9A8"/>
    <circle cx="1470" cy="72" r="20" fill="url(#bulbGlow)" opacity="0.55"/><circle cx="1470" cy="72" r="6" fill="#FFE9A8"/>
  </g>

