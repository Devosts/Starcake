<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 680" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="wall" cx="50%" cy="40%" r="85%">
      <stop offset="0" stop-color="#54382A"/>
      <stop offset="0.45" stop-color="#3A271B"/>
      <stop offset="1" stop-color="#1D110A"/>
    </radialGradient>
    <pattern id="brick" x="0" y="0" width="160" height="64" patternUnits="userSpaceOnUse">
      <rect width="160" height="64" fill="none"/>
      <path d="M0 0 H160 M0 32 H160 M0 64 H160 M80 0 V32 M0 32 V64 M160 32 V64" stroke="#2A1A10" stroke-width="2.5" opacity="0.55"/>
    </pattern>
    <radialGradient id="floorGlow" cx="50%" cy="46%" r="55%">
      <stop offset="0" stop-color="#FFDF9E" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#FFDF9E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="counter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#332114"/>
      <stop offset="0.12" stop-color="#241409"/>
      <stop offset="1" stop-color="#120A05"/>
    </linearGradient>
    <linearGradient id="tier" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5B3A26"/>
      <stop offset="0.5" stop-color="#42281A"/>
      <stop offset="1" stop-color="#2C1A10"/>
    </linearGradient>
    <linearGradient id="loafG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3E2818"/>
      <stop offset="1" stop-color="#281708"/>
    </linearGradient>
    <radialGradient id="bulbGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFF3C4"/>
      <stop offset="0.45" stop-color="#F8CD72"/>
      <stop offset="1" stop-color="#F8CD72" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lampShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6B4B2E"/>
      <stop offset="1" stop-color="#3E2812"/>
    </linearGradient>
    <radialGradient id="lightCone" cx="50%" cy="0%" r="70%">
      <stop offset="0" stop-color="#FFE9A8" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#FFE9A8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shadowBlur" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#000000" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Wall -->
  <rect width="1600" height="680" fill="url(#wall)"/>
  <rect width="1600" height="680" fill="url(#brick)"/>
  <ellipse cx="800" cy="330" rx="640" ry="300" fill="url(#floorGlow)"/>

  <!-- Pendant lamps -->
  <line x1="430" y1="0" x2="430" y2="96" stroke="#1A0F08" stroke-width="4"/>
  <path d="M398 96 L462 96 L478 138 L382 138 Z" fill="url(#lampShade)" stroke="#201209" stroke-width="3" stroke-linejoin="round"/>
  <ellipse cx="430" cy="138" rx="46" ry="8" fill="#FFE9A8" opacity="0.9"/>
  <polygon points="386,146 474,146 560,420 300,420" fill="url(#lightCone)"/>

  <line x1="1170" y1="0" x2="1170" y2="96" stroke="#1A0F08" stroke-width="4"/>
  <path d="M1138 96 L1202 96 L1218 138 L1122 138 Z" fill="url(#lampShade)" stroke="#201209" stroke-width="3" stroke-linejoin="round"/>
  <ellipse cx="1170" cy="138" rx="46" ry="8" fill="#FFE9A8" opacity="0.9"/>
  <polygon points="1126,146 1214,146 1300,420 1040,420" fill="url(#lightCone)"/>

